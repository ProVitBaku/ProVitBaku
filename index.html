<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProVitBaku - İdman Qidaları</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; text-align: center; }
        .header { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; border-bottom: 3px solid #ff4500; }
        .logo { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 2px solid #ff4500; }
        .header h1 { margin: 5px 0; color: #ff4500; font-size: 24px; }
        .header p { color: #ccc; font-size: 14px; margin: 0; }
        .products { display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; width: 100%; max-width: 320px; padding: 15px; text-align: left; box-sizing: border-box; }
        .card h3 { margin: 0 0 10px; color: #ff4500; }
        .price { font-size: 18px; font-weight: bold; color: #4CAF50; margin: 10px 0; }
        .btn { display: block; background: #25D366; color: white; text-align: center; padding: 10px; border-radius: 5px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="ProVitBaku Logo" class="logo">
        <h1>ProVitBaku</h1>
        <p>Keyfiyyətli Protein və Vitaminlər</p>
    </div>

    <div class="products">
        <div class="card">
            <h3>Whey Protein</h3>
            <p>Əzələ inkişafı üçün yüksək keyfiyyətli protein.</p>
            <div class="price">95 AZN</div>
            <a href="https://wa.me/994709939998?text=Salam,%20Whey%20Protein%20sifariş%20etmək%20istəyirəm." class="btn">WhatsApp ilə Sifariş</a>
        </div>

        <div class="card">
            <h3>Creatine Monohydrate</h3>
            <p>Güc və enerji artırıcı.</p>
            <div class="price">45 AZN</div>
            <a href="https://wa.me/994709939998?text=Salam,%20Creatine%20sifariş%20etmək%20istəyirəm." class="btn">WhatsApp ilə Sifariş</a>
        </div>
    </div>

</body>
</html>
